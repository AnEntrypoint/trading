name: pipeline

on:
  push:
  workflow_dispatch:

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r eth-strategy-lab/requirements.txt
      - name: Run full research pipeline
        working-directory: eth-strategy-lab
        run: python run_all.py
